name = "instant-site-licence"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Set this to your GitHub Pages origin once deployed. "*" is fine while testing,
# but narrowing it means only your own site can write usage events.
[vars]
ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "instant-site"
database_id = "337d4a9f-9d03-4c60-9caa-28f6dae93e03"
